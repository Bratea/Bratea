<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Tongtong (Bratea) — Use code to change the world</title>
  <desc id="desc">终端窗口风格个人简介：Tongtong，Use code to change the world!，whoami 输出 A developer who loves coding / Coding Newbie · Handsome Guy，技能 Java / Python / Vue / React / Go / C++</desc>

  <!-- 背景（圆角卡片） -->
  <rect x="0" y="0" width="1200" height="440" rx="24" fill="#0d1117"/>

  <!-- 终端窗口 -->
  <rect x="40" y="24" width="1120" height="416" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- 标题栏 -->
  <circle cx="78" cy="48" r="7" fill="#ff5f56"/>
  <circle cx="104" cy="48" r="7" fill="#ffbd2e"/>
  <circle cx="130" cy="48" r="7" fill="#27c93f"/>
  <text x="600" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#8b949e" text-anchor="middle">tongtong — zsh — ~/developer</text>

  <!-- 名字 -->
  <text id="name" x="72" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="68" font-weight="700" fill="#e6edf3">Tongtong</text>
  <text id="aka" x="430" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="600" fill="#8b949e">aka Bratea</text>

  <!-- 座右铭（原 tagline 位置） -->
  <text id="tagline" x="72" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="500" fill="#f89820">Use code to change the world!</text>

  <!-- 分隔线 -->
  <line x1="72" y1="196" x2="1128" y2="196" stroke="#30363d" stroke-width="1.5"/>

