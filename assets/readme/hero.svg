  <text id="t2" x="72" y="258" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="20" fill="#e6edf3"><tspan fill="#f89820">→</tspan> A developer who loves coding</text>
  <text id="t2b" x="72" y="288" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="20" fill="#e6edf3"><tspan fill="#f89820">→</tspan> Coding Newbie · Handsome Guy</text>

  <text id="t3" x="72" y="318" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="20" fill="#7ee787">$ skills</text>
  <text id="t4" x="72" y="348" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="20" fill="#e6edf3"><tspan fill="#f89820">→</tspan> Java · Python · Vue · React · Go · C++</text>
